# Dioxus 0.7. RERAG's Dioxus.toml is 0.5/0.6-era and its [application] keys
# are not all read by 0.7, so this is written for the CLI in flake.nix
# (dioxus-cli 0.7.9) rather than copied across.
[application]
name = "glpi-inv"

[web.app]
title = "GLPI inventory"

[web.watcher]
watch_path = ["frontend/fro/src", "frontend/fro/assets"]
reload_html = true

# Both tables are required. [web.resource] without [web.resource.dev] fails
# with `missing field \`dev\``, which reads like a syntax error rather than an
# absent section - RERAG's 0.6-era file had both, and dropping one was mine.
[web.resource]
style = []
script = []

[web.resource.dev]
style = []
script = []

[web.wasm_opt]
level = "z"

# Hot reload would otherwise show every data page in its error state.
#
# api.rs builds request URLs from the PAGE's own origin, which under `dx serve`
# is the dev server, not the backend - so /api/* would hit the dev server,
# which has no such routes, and the Rights page would render "could not read"
# instead of a table. Forwarding /api to the real backend restores same-origin,
# so the dev server behaves like the deployed bundle and no code has to know
# which of the two is serving it.
#
# Verified rather than assumed: `dx check` accepts unknown tables silently, so
# this was tested by serving on a spare port and confirming /api/rights came
# back as 180 KB of real JSON rather than the dev server's 404.
#
# The backend must already be running - `just run`, or the installed service.
[[web.proxy]]
backend = "http://127.0.0.1:3200/api"

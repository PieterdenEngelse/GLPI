[package]
name = "glpi-inv-backend"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GLPI inventory telemetry backend - reads agent check-ins from GLPI's High-Level API"

[[bin]]
name = "glpi-inv-backend"
path = "src/main.rs"

[lib]
name = "glpi_inv_backend"
path = "src/lib.rs"

[dependencies]
# axum, not actix-web. RERAG uses actix; this matches the GLPI engine and
# nixdash so there is one HTTP idiom across these services.
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7", features = ["trace", "cors", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

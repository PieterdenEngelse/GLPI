[package]
name = "glpi-inv-frontend"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GLPI inventory telemetry - Dioxus web UI"

[dependencies]
# PINNED with `=` to the exact dioxus-cli version in flake.nix. A plain
# "0.7" resolves to the newest 0.7.x and dx then refuses outright:
#   dx and dioxus versions are incompatible!
#     dx version: 0.7.9   dioxus versions: [0.7.10]
# Bump this and the nixpkgs pin together, never one alone.
dioxus = { version = "=0.7.9", features = ["web"] }

# NOT `=`-pinned, unlike `dioxus` above, and the difference matters.
#
# dx checks the `dioxus` crate's version against its own and refuses on a
# mismatch, which is why that one is pinned exactly. It does not check
# dioxus-router. Pinning the router to =0.7.9 to match left it paired with
# dioxus-router-macro 0.7.10, which cargo resolves independently - the
# Routable derive comes from the macro crate and generates code against the
# router crate's API. That compiles, because the surface still lines up, and
# can still misbehave at runtime where it touches history and Outlet.
#
# A caret range lets the router track the rest of the family (core, web,
# history are all 0.7.10 here) and keeps it level with its own macro.
dioxus-router = { version = "0.7" }

# Timed futures on wasm32. tokio::time does not exist here - there is no
# timer driver in the browser - and this is the crate RERAG uses for the
# same job. `futures` feature for the awaitable TimeoutFuture.
gloo-timers = { version = "0.3", features = ["futures"] }
serde = { workspace = true }
serde_json = { workspace = true }

# reqwest on wasm32 compiles to the browser's fetch API. default-features off
# because the native TLS stack has no meaning here and pulls in C code that
# cannot link for wasm.
reqwest = { version = "0.12", default-features = false, features = ["json"] }

# Only to read window.location.origin. reqwest on wasm32 cannot take a
# relative URL - it has no base to resolve against and fails at the builder
# stage with a bare "builder error" - so the origin has to come from the
# browser and be prepended by hand.
web-sys = { version = "0.3", features = ["Window", "Location", "Document", "Element", "Storage"] }
